---
# Handlers run in this order. If the combined sshd configuration does not validate, the play fails here and sshd is
# NOT reloaded (the running daemon keeps its old, working configuration).
- name: Validate the full sshd configuration
  ansible.builtin.command:
    argv: [/usr/sbin/sshd, -t]
  changed_when: false

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted

- name: Apply sysctl settings
  ansible.builtin.command:
    argv: [sysctl, -p, /etc/sysctl.d/60-tocs-hardening.conf]
  changed_when: true
